<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security &amp; Danger Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#eceff3; --surface:#fff; --surface-2:#f6f8fa;
  --ink:#151a21; --ink-2:#3d4854; --muted:#69737f; --rule:#d2d8df; --rule-2:#e5e9ee;
  --accent:#17497a; --accent-soft:#e7eef6;
  --s1:#e8b44a; --s2:#dd8434; --s3:#c04f2c; --s4:#8d2020;
  --up:#a8342a; --down:#1c6f52; --flat:#69737f;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ar:"Sakkal Majalla","Majalla UI","Noto Naskh Arabic","Traditional Arabic",
       "Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --latin:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --panel-hidden:100%;
  --r:10px;          /* one corner radius everywhere */
  --hair:1px solid var(--rule);
  --shadow:0 1px 2px rgba(16,24,32,.04), 0 8px 24px rgba(16,24,32,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--canvas); color:var(--ink);
  font:13px/1.45 var(--latin);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}

/* ---- status strip ---------------------------------------------------- */
.status{
  display:flex;flex-wrap:wrap;align-items:stretch;gap:0;
  background:var(--ink);color:#fff;border-bottom:3px solid var(--accent);
}
.status .brand{padding:11px 18px;font-weight:650;letter-spacing:.01em;font-size:14px;
  border-inline-end:1px solid #2c3540;display:flex;align-items:center;gap:9px}
.status .brand span{font-weight:400;color:#93a0ae;font-size:11.5px}
.stat{padding:9px 18px;border-inline-end:1px solid #2c3540;min-width:132px}
.stat b{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.stat i{display:block;font-style:normal;font-size:10.5px;color:#93a0ae;margin-bottom:2px;
  letter-spacing:.02em}
.stat.warn b{color:#ffc96b}
.status .spacer{flex:1;border:0}
.viewtabs{display:flex;align-items:stretch}
.viewtabs button{padding:0 15px;color:#aab4c0;font-size:12.5px;border-radius:7px;
  transition:background .15s,color .15s}
.viewtabs button:hover{background:rgba(255,255,255,.06);color:#fff}
.viewtabs button[aria-selected=true]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}

/* ---- toolbar --------------------------------------------------------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:11px 16px;background:var(--surface);border-bottom:var(--hair)}
.toolbar label{font-size:11px;color:var(--muted);margin-inline-end:-4px}
input[type=search],select{
  border:var(--hair);background:var(--surface);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:12.5px;color:var(--ink);min-height:34px;
  transition:border-color .15s,box-shadow .15s}
input[type=search]:hover,select:hover{border-color:#c4ccd6}
input[type=search]:focus,select:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(43,90,143,.12);outline:none}
input[type=search]{min-width:210px}
input:focus-visible,select:focus-visible,button:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.winsel{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:2px}
.winsel button{padding:6px 12px;font-size:12.5px;color:var(--ink-2);border-radius:7px;
  transition:background .15s,color .15s}
.winsel button:hover{color:var(--ink)}
.winsel button[aria-pressed=true]{background:var(--surface);color:var(--ink);
  font-weight:600;box-shadow:0 1px 2px rgba(16,24,32,.10)}
.pill{margin-inline-start:auto;font-size:11.5px;color:var(--muted)}
.linkbtn{color:var(--accent);font-size:12px;text-decoration:underline}

/* ---- table ----------------------------------------------------------- */
.tablewrap{overflow:auto;height:calc(100vh - 108px);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
thead th{
  position:sticky;top:0;z-index:3;background:var(--surface);
  border-bottom:var(--hair);
  padding:9px 10px;text-align:end;font-weight:600;font-size:11px;color:var(--muted);
  letter-spacing:.02em;white-space:nowrap;cursor:pointer;vertical-align:bottom}
thead th:hover{color:var(--ink)}
thead th.l{text-align:start}
thead th .sub{display:block;font-weight:400;color:var(--muted);font-size:10px}
thead th[aria-sort]:after{content:"";margin-inline-start:4px;opacity:.75}
thead th[aria-sort=descending]:after{content:"\25BE"}
thead th[aria-sort=ascending]:after{content:"\25B4"}
th.group{text-align:center;font-size:10px;color:var(--muted);text-transform:none;
  background:var(--surface);border-bottom:1px solid var(--rule-2)}
tbody td{padding:5px 8px;text-align:end;border-bottom:1px solid var(--rule-2);
  border-inline-end:1px solid var(--rule-2);white-space:nowrap}
tbody td.l{text-align:start}
tbody tr:hover{background:#f2f6fa}
td.country{position:sticky;inset-inline-start:0;background:var(--surface);z-index:2;
  border-inline-end:1px solid var(--rule);font-weight:600}
tbody tr:hover td.country{background:#f2f6fa}
thead th.country{position:sticky;inset-inline-start:0;z-index:4}
.cnt{display:inline-block;min-width:22px;padding:1px 5px;border-radius:2px;
  text-decoration:none;color:var(--ink);cursor:pointer}
.cnt:hover{background:var(--accent);color:#fff}
.cnt.zero{color:#b9c1c9;cursor:default}
.cnt.zero:hover{background:none;color:#b9c1c9}
.sev1{background:#fbf0d8}.sev2{background:#f8e0c4}.sev3{background:#f2cdbe}.sev4{background:#e9b8b0}
.trend{font-size:11px;font-weight:600;white-space:nowrap}
.t-up{color:var(--up)}.t-down{color:var(--down)}.t-flat{color:var(--flat)}
.t-esc{color:#fff;background:var(--up);padding:1px 6px;border-radius:2px}
.status-tag{font-size:10.5px;letter-spacing:.03em;color:var(--muted);
  border:1px solid var(--rule);padding:1px 6px;border-radius:2px}
.delta.pos{color:var(--up)}.delta.neg{color:var(--down)}

/* ---- drill-down panel ------------------------------------------------ */
.scrim{position:fixed;inset:0;background:rgba(20,26,33,.42);opacity:0;pointer-events:none;
  transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;inset-inline-end:0;bottom:0;width:min(680px,94vw);background:var(--surface);
  border-inline-start:1px solid var(--rule);z-index:50;display:flex;flex-direction:column;
  transform:translateX(var(--panel-hidden));transition:transform .2s cubic-bezier(.3,.7,.3,1);
  box-shadow:0 0 28px rgba(20,26,33,.16)}
.panel.on{transform:none}
.panel header{padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.panel header h2{margin:0;font-size:15px;font-weight:650}
.panel .body{overflow:auto;padding:14px 16px;flex:1}
.close{position:absolute;top:9px;inset-inline-end:12px;font-size:20px;color:var(--muted);line-height:1;
  padding:4px 8px}
.trail{font-size:10.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em;
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding-inline-end:34px}
.trail b{color:var(--accent);font-weight:600}
.trail .sep{color:#adb6c0}
.audit{background:var(--accent-soft);border-inline-start:3px solid var(--accent);
  padding:8px 11px;font-size:11.5px;color:var(--ink-2);margin-bottom:12px}

.inc{border:1px solid var(--rule-2);border-inline-start:3px solid var(--rule);
  padding:9px 11px;margin-bottom:9px;background:var(--surface);cursor:pointer}
.inc:hover{border-inline-start-color:var(--accent);background:var(--surface-2)}
.inc h3{margin:0 0 3px;font-size:13px;font-weight:600;line-height:1.35}
.inc .meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:7px}
.inc .sum{font-size:11.5px;color:var(--ink-2);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:10px;padding:1px 5px;border-radius:2px;background:var(--surface-2);
  border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.badge.fat{background:#f7e4e1;border-color:#e3bdb6;color:#7d241a}
.badge.merged{background:#e7eef6;border-color:#bcd0e4;color:var(--accent)}
.badge.unver{background:#fbf3dd;border-color:#e3d3a3;color:#7a5c12}
.badge.est{background:#eef1f4;color:var(--muted)}

dl.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;margin:0 0 14px;font-size:12px}
dl.kv dt{color:var(--muted);font-size:11px}
dl.kv dd{margin:0;word-break:break-word}
h4.sec{font-size:11px;color:var(--muted);font-weight:600;margin:16px 0 7px;
  padding-bottom:4px;border-bottom:1px solid var(--rule-2)}
ul.srcs{list-style:none;padding:0;margin:0;font-size:12px}
ul.srcs li{padding:5px 0;border-bottom:1px solid var(--rule-2)}
ul.srcs .dom{color:var(--muted);font-size:10.5px;font-family:var(--mono)}
.evbox{background:var(--surface-2);border:1px solid var(--rule-2);padding:8px 10px;
  font-size:11px;font-family:var(--mono);white-space:pre-wrap;color:var(--ink-2);
  max-height:220px;overflow:auto}
.rationale{font-size:11.5px;color:var(--ink-2);margin:0;padding-inline-start:16px}
.rationale li{margin-bottom:3px}

/* ---- country + map views -------------------------------------------- */
.view{display:none}.view.on{display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
  background:var(--rule-2);border:1px solid var(--rule-2);margin-bottom:14px}
.cgrid div{background:var(--surface);padding:9px 11px}
.cgrid b{display:block;font-size:19px;font-weight:600;line-height:1.15}
.cgrid i{font-style:normal;font-size:10.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:11.5px}
.bar .lab{width:186px;color:var(--ink-2)}
.bar .track{flex:1;height:13px;background:var(--surface-2);position:relative}
.bar .fill{height:100%;background:var(--accent)}
.bar .n{width:34px;text-align:end;font-weight:600}
#map{height:calc(100vh - 152px);background:#dfe4ea}
.maptools{display:flex;gap:9px;flex-wrap:wrap;padding:9px 14px;background:var(--surface);
  border-bottom:1px solid var(--rule);align-items:center}
.leaflet-popup-content{margin:9px 11px;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.leaflet-popup-content h3{margin:0 0 4px;font-size:12.5px}
.prox{border:1px solid var(--rule-2);margin-bottom:12px}
.prox .head{background:var(--surface-2);padding:6px 10px;font-size:11px;font-weight:600;
  border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between}
.prox .row{padding:5px 10px;font-size:12px;display:flex;justify-content:space-between;
  border-bottom:1px solid var(--rule-2);cursor:pointer}
.prox .row:hover{background:var(--surface-2)}
.prox .row:last-child{border:0}
.prox .row.unres{color:var(--muted);font-style:italic}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.note{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.5}
@media(max-width:760px){
  .tablewrap{height:auto;max-height:none}
  dl.kv{grid-template-columns:1fr}
  .status .brand{width:100%;border-inline-end:0}
}
/* ---- mobile cards ---------------------------------------------------
   Below 860px the table is replaced entirely. This is the fix for the
   country column painting blank on iOS: with no horizontal scroll there is
   no sticky cell to detach. */
.cards{display:none}
@media(max-width:860px){
  .tablewrap table{display:none}
  .tablewrap{height:auto;overflow:visible;background:transparent;
    padding:10px 10px 40px}
  .cards{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--surface);border:var(--hair);border-radius:var(--r);
    padding:12px 13px;cursor:pointer;transition:border-color .15s,transform .06s}
  .card:active{transform:scale(.995)}
  .card .top{display:flex;align-items:baseline;gap:8px}
  .card .rank{font-size:11px;color:var(--muted);min-width:26px;font-variant-numeric:tabular-nums}
  .card .nm{font-size:15px;font-weight:600;color:var(--ink);flex:1;line-height:1.3}
  .card .big{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}
  .card .big small{font-size:11px;font-weight:400;color:var(--muted);
    margin-inline-start:5px;letter-spacing:0}
  .card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .card .chip{font-size:11px;padding:3px 8px;border-radius:99px;
    background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .card .chip b{font-weight:650;color:var(--ink)}
  .card .chip.fat{background:#fdeceb;color:#8d2c25}
  .card .chip.t-esc,.card .chip.t-up{background:#fdeceb;color:#8d2c25}
  .card .chip.t-down{background:#eaf5ee;color:#22603a}
  .card .chip.scope{background:#eef2f7;color:#4b5b6b;font-style:italic}
  .toolbar{padding:9px 10px;gap:7px}
  .toolbar label{display:none}
  input[type=search]{min-width:0;flex:1 1 100%}
  .pill{margin:0;width:100%;text-align:start}
  .panel{width:100vw;max-width:100vw}
  .status{flex-wrap:wrap}
  .status .stat{flex:1 1 auto;min-width:33%}
}
/* ---- dropdowns ---- */
select.enhanced{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sel{position:relative;display:inline-block}
.sel-btn{display:flex;align-items:center;gap:7px;min-height:34px;
  padding:7px 10px;border:var(--hair);border-radius:8px;background:var(--surface);
  font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;
  transition:border-color .15s,box-shadow .15s;white-space:nowrap}
.sel-btn:hover{border-color:#c4ccd6}
.sel[data-open=true] .sel-btn{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(43,90,143,.12)}
.sel-btn .cv{flex:1;text-align:start;overflow:hidden;text-overflow:ellipsis}
.sel-btn .cx{width:8px;height:8px;flex:none;opacity:.45;
  border-inline-end:1.6px solid currentColor;border-bottom:1.6px solid currentColor;
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .18s}
.sel[data-open=true] .sel-btn .cx{transform:rotate(-135deg) translate(-3px,-3px)}
.sel-menu{position:absolute;top:calc(100% + 5px);inset-inline-start:0;z-index:60;
  min-width:100%;max-height:290px;overflow:auto;padding:5px;
  background:var(--surface);border:var(--hair);border-radius:var(--r);
  box-shadow:var(--shadow);display:none}
.sel[data-open=true] .sel-menu{display:block}
.sel-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;
  font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.sel-opt:hover,.sel-opt.active{background:var(--surface-2)}
.sel-opt[aria-selected=true]{font-weight:600}
.sel-opt .tick{width:14px;flex:none;opacity:0;color:var(--accent);font-weight:700}
.sel-opt[aria-selected=true] .tick{opacity:1}
@media(max-width:860px){
  .sel{flex:1 1 auto;min-width:0}
  .sel-btn{width:100%}
  .sel-menu{max-height:60vh}
}
.srcbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  padding:8px 16px;background:var(--surface-2);border-bottom:var(--hair);
  font-size:11.5px;color:var(--muted)}
.srcbar a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.srcbar a:hover{border-bottom-color:currentColor}
.srcbar .eff{color:var(--muted);font-variant-numeric:tabular-nums}
.badge.desig{background:#eef3f9;color:#2a5583;border:0;font-weight:600}
.badge.meas{background:#f4f6f8;color:#69737d;border:0;font-weight:500}
.badge.div{background:#fdf3e3;color:#8a5a12;border:0;font-weight:500}
td.dstat .badge{display:inline-block;margin:1px 0}
td.dstat{white-space:nowrap;line-height:1.9}
@media(max-width:860px){.srcbar{padding:8px 10px;font-size:11px}}
.story{border:var(--hair);border-radius:var(--r);padding:11px 13px;margin:8px 0}
.story .st-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
.story .st-meta{font-size:11px;color:var(--muted);margin:3px 0 7px}
.story ul.srcs{margin:0}
html[dir=rtl]{--panel-hidden:-100%}
html[dir=rtl] body{font-family:var(--ar);font-size:14.5px;line-height:1.7}
/* Majalla sets small for its point size, Noto Naskh sets larger. Each gets the
   size that matches the other optically, so the layout does not shift between a
   machine that has Majalla and one that falls back. */
html[dir=rtl][data-majalla="0"] body{font-size:13.4px;line-height:1.65}
html[dir=rtl][data-majalla="0"] table{font-size:12.2px}
html[dir=rtl][data-majalla="0"] .status .brand{font-size:14.5px}
html[dir=rtl] .status .brand{font-size:15.5px}
html[dir=rtl] table{font-size:13px}
html[dir=rtl] thead th{font-size:12px}
html[dir=rtl] .bar .lab{width:210px}
html[dir=rtl] dl.kv{grid-template-columns:170px 1fr}

/* GDELT codes its source text in English. Isolating it keeps trailing
   punctuation, parentheses and digits attached to the right words instead of
   migrating to the far end of an RTL line. */
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
html[dir=rtl] .inc h3,html[dir=rtl] .inc .sum,html[dir=rtl] .evbox,
html[dir=rtl] ul.srcs li,html[dir=rtl] .leaflet-popup-content h3{direction:ltr;text-align:left}
html[dir=rtl] .inc{border-inline-start-width:3px}
/* Digits stay Western and read left-to-right inside Arabic text. */
.num,.badge.fat,code,.dom{direction:ltr;unicode-bidi:isolate}
html[dir=rtl] .trail{padding-inline-end:34px;padding-left:0}
/* Row number. Sticky alongside the country so the count stays visible while the
   category columns scroll. Numbers the filtered view, not the whole store. */
td.serial,thead th.serial{position:sticky;inset-inline-start:0;width:40px;min-width:40px;
  text-align:center;color:var(--muted);font-size:11px;background:var(--surface-2);
  border-inline-end:1px solid var(--rule);z-index:2}
thead th.serial{z-index:5;cursor:default}
tbody tr:hover td.serial{background:#e8eef5}
td.country,thead th.country{inset-inline-start:40px}
.langsel{display:flex;align-items:stretch}
.langsel button{padding:0 13px;color:#b6c0cb;font-size:12px;
  border-inline-start:1px solid #2c3540}
.langsel button[aria-pressed=true]{color:#fff;font-weight:600;background:#2c3540}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="status" id="status"></div>

<!-- ============ GLOBAL VIEW ============ -->
<section class="view on" id="v-global">
  <div class="toolbar">
    <input type="search" id="q" data-i18n-ph="search" aria-label="Search">
    <label for="f-region" data-i18n="region"></label><select id="f-region"></select>
    <label for="f-cat" data-i18n="category"></label><select id="f-cat"></select>
    <label for="f-trend" data-i18n="trend"></label><select id="f-trend">
      <option value="" data-i18n="all"></option><option value="SIGNIFICANT ESCALATION" data-i18n="tr_esc"></option>
      <option value="DETERIORATING" data-i18n="tr_det"></option><option value="STABLE" data-i18n="tr_sta"></option>
      <option value="IMPROVING" data-i18n="tr_imp"></option><option value="INSUFFICIENT HISTORY" data-i18n="tr_nc"></option>
    </select>
    <label for="f-scope" data-i18n="scope"></label>
      <select id="f-scope">
        <option value="COUNTRY" selected data-i18n="scopeCountries"></option>
        <option value="" data-i18n="scopeAll"></option>
      </select>
      <label for="f-status" data-i18n="danger"></label><select id="f-status"><option value="">All</option></select>
    <div class="winsel" role="group" aria-label="Counting window">
      <button data-win="d1" data-i18n="w1"></button>
      <button data-win="d7" data-i18n="w7"></button>
      <button data-win="d30" aria-pressed="true" data-i18n="w30"></button>
      <button data-win="d90" data-i18n="w90"></button>
      <button data-win="all" data-i18n="wall"></button>
    </div>
    <span class="pill" id="rowcount"></span>
  </div>
  <div class="srcbar" id="srcbar"></div>
  <div class="tablewrap"><div class="cards" id="cards"></div><table id="tbl"><thead></thead><tbody></tbody></table></div>
</section>

<!-- ============ COUNTRY VIEW ============ -->
<section class="view" id="v-country">
  <div class="toolbar">
    <button class="linkbtn" id="backGlobal" data-i18n="allCountries"></button>
    <strong id="cName" style="font-size:14px"></strong>
    <span class="status-tag" id="cStatus"></span>
    <span id="cTrend"></span>
    <label for="cCat" style="margin-inline-start:12px" data-i18n="category"></label>
    <select id="cCat"></select>
    <label for="cCity" data-i18n="proximityTo"></label>
    <select id="cCity"><option value="">— select a city —</option></select>
    <span class="pill" id="cCount"></span>
  </div>
  <div style="padding:14px;overflow:auto;height:calc(100vh - 152px)">
    <div class="cgrid" id="cStats"></div>
    <div id="cProx"></div>
    <h4 class="sec" data-i18n="catDist"></h4>
    <div id="cBars"></div>
    <h4 class="sec" data-i18n="incWindow"></h4>
    <div id="cList"></div>
  </div>
</section>

<!-- ============ MAP VIEW ============ -->
<section class="view" id="v-map">
  <div class="maptools">
    <label for="m-country" data-i18n="country"></label><select id="m-country"></select>
    <label for="m-cat" data-i18n="category"></label><select id="m-cat"></select>
    <label for="m-win" data-i18n="window"></label><select id="m-win">
      <option value="d1">1 day</option><option value="d7" data-i18n="w7"></option><option value="d30" selected data-i18n="w30"></option>
      <option value="d90" data-i18n="w90"></option><option value="all" data-i18n="wall"></option>
    </select>
    <label><input type="checkbox" id="m-fatal"> <span data-i18n="fatalOnly"></span></label>
    <span class="pill" id="m-count"></span>
  </div>
  <div id="map"></div>
</section>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <header>
    <div class="trail" id="pTrail"></div>
    <h2 id="pTitle"></h2>
    <button class="close" id="pClose" aria-label="Close">&times;</button>
  </header>
  <div class="body" id="pBody"></div>
</aside>

const _unmapped=new Set();

  if(LANG!=="ar") return c;

    console.warn("[i18n] no Arabic name for country:",c,"— showing English"); }

};

/* ---------- window arithmetic, identical to the pipeline ---------- */
function bounds(win){
  const as=new Date(D.meta.as_of+"T00:00:00Z"), d=n=>{const x=new Date(as);x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)};
  if(win==="all") return [D.meta.coverage_start, D.meta.as_of];
  return [{d1:d(0),d7:d(6),d30:d(29),d90:d(89)}[win], D.meta.as_of];
}
const inWin=(dt,win)=>{const[a,b]=bounds(win);return dt&&dt>=a&&dt<=b};
function label(win){return {d1:T("lw1"),d7:T("lw7"),d30:T("lw30"),d90:T("lw90"),all:T("lwall")}[win]}

/* Single source of truth: the table, the drill-down and the map all call this,
   so a displayed number and its underlying list can never disagree. */
function select({country=null,category=null,win=WIN,fatalOnly=false,text=null,overlay=false}={}){
  return D.incidents.filter(i=>{
    if(country && i.country!==country) return false;
    if(category){
      const hit = overlay ? (i.overlay_categories||[]).includes(category)
                          : i.security_category===category;
      if(!hit) return false;
    }
    if(!inWin(i.event_date,win)) return false;
    if(fatalOnly && !(i.fatalities>0)) return false;
    if(text){const t=text.toLowerCase();
      if(!((i.title||"")+" "+(i.summary||"")+" "+(i.location||"")).toLowerCase().includes(t)) return false;}
    return true;
  }).sort((a,b)=>(b.event_date||"").localeCompare(a.event_date||"")
      || (b.significance||0)-(a.significance||0));
}
const sevClass=n=>n===0?"zero":n<3?"sev1":n<8?"sev2":n<20?"sev3":"sev4";

      <span class="eff">(${T("effective")} ${esc(s.dssr650.rates_effective)})</span></span>
`;
}

function statusCell(r){
  const d=r.designation||{}, m=r.measurement||{};
  if(r.committee_override)
    return `<span class="badge desig" title="${esc(r.danger_basis||"")}">${esc(r.committee_override)}</span>`;
  const bits=[];
  if(d.designated){
    // The rate belongs to a specific post, not to the country, so it sits in
    // the tooltip rather than being read off the row as a country-wide figure.
    const rate=(d.dssr650&&d.dssr650.max_rate)?` — ${d.dssr650.max_rate}%`:"";
    bits.push(`<span class="badge desig" title="${esc((r.danger_basis||"")+rate)}">${T("designated")}</span>`);
  }else{
    bits.push(`<span class="badge meas" title="${esc(m.reason||r.danger_basis||"")}">${esc(T("band_"+m.band))}</span>`);
  }
  if(r.divergence)
    bits.push(`<span class="badge div" title="${esc(T("div_"+r.divergence+"_hint"))}">${esc(T("div_"+r.divergence))}</span>`);
  return bits.join(" ");
}

function renderStatus(){
  const m=D.meta, stale=m.latest_event_date && m.latest_event_date < bounds("d7")[0];
  // A store starting later than GDELT coverage means history was never fetched.
  // Flagging it is the difference between "quiet" and "not looked".
  const gap = m.store_earliest_event && m.store_earliest_event > m.coverage_start;
  $("#status").innerHTML=`
    <div class="brand">${T("brand")}</div>
    <div class="stat"><i>${T("lastRefresh")}</i><b>${esc(localStamp(m.last_refresh))}</b></div>
    <div class="stat ${stale?"warn":""}"><i>${T("latestEventDate")}</i><b>${esc(m.latest_event_date||T("none"))}</b></div>
    <div class="stat"><i>${T("coverageStart")}</i><b>${esc(m.coverage_start)}</b></div>
    <div class="stat ${gap?"warn":""}" title="${esc(gap?T("gapHint"):"")}"><i>${T("storedFrom")}</i><b>${esc(m.store_earliest_event||"–")}${gap?" ⚠":""}</b></div>
    <div class="stat"><i>${T("incidentsStored")}</i><b class="num">${m.total_incidents.toLocaleString()}</b></div>
    <div class="stat"><i>${T("rawEvents")}</i><b class="num">${m.total_raw_events.toLocaleString()}</b></div>
    <div class="spacer"></div>
    <div class="langsel">
      <button data-lang="ar" aria-pressed="${LANG==="ar"}">العربية</button>
      <button data-lang="en" aria-pressed="${LANG==="en"}">EN</button>
    </div>
    <div class="viewtabs">
      <button data-view="global" aria-selected="true">${T("vGlobal")}</button>
      <button data-view="country" aria-selected="false">${T("vCountry")}</button>
      <button data-view="map" aria-selected="false">${T("vMap")}</button>
    </div>`;
  $$("#status .langsel button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  $$("#status .viewtabs button").forEach(b=>b.onclick=()=>{
    if(b.dataset.view==="country" && !CUR_COUNTRY){
      CUR_COUNTRY=(D.countries[0]||{}).country; }
    show(b.dataset.view);
  });
}
function show(v){
  VIEW=v;
  $$(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $$("#status .viewtabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  if(v==="country") renderCountry();
  if(v==="map"){ setTimeout(()=>{initMap();renderMap();},30); }
}

const HEAD=()=>[
  {k:"country",t:T("country"),l:1,cls:"country"},
  {k:"danger_status",t:T("dangerStatus"),l:1},
  {k:"d1_incidents",t:T("c1")},{k:"d7_incidents",t:T("c7")},{k:"d30_incidents",t:T("c30")},
  {k:"prev30_incidents",t:T("prev30")},{k:"chg",t:T("chg30")},
  {k:"d90_incidents",t:T("c90")},
  {k:"d30_fatalities",t:T("fat30")},{k:"d90_fatalities",t:T("fat90")}
];
function renderCards(rows){
  const box=$("#cards"); if(!box) return;
  if(!rows.length){ box.innerHTML=`<div class="empty">${T("noCountries")}</div>`; return; }
  box.innerHTML = rows.map((r,ix)=>{
    // Only categories with a non-zero count are shown. A phone card listing
    // eleven zeroes tells the reader nothing.
    const cats=COLS.filter(c=>D.categories[c] && r.categories[c]>0)
      .sort((a,b)=>r.categories[b]-r.categories[a]).slice(0,4)
      .map(c=>`<span class="chip"><b>${r.categories[c]}</b> ${esc(SHORT[LANG][c])}</span>`).join("");
    const fat=r.d30_fatalities>0
      ? `<span class="chip fat"><b>${r.d30_fatalities}</b> ${T("killed")}</span>` : "";
    const tr=r.trend.label===NOCOV ? ""
      : `<span class="chip ${trCls(r.trend.label)}">${esc(TREND(r.trend.label))}</span>`;
    const scope=r.geo_scope&&r.geo_scope!=="COUNTRY"
      ? `<span class="chip scope">${esc(T("scope_"+r.geo_scope))}</span>` : "";
    return `<div class="card" data-country="${esc(r.country)}" tabindex="0">
      <div class="top">
        <span class="rank">${ix+1}</span>
        <span class="nm">${esc(CTRY(r.country))}</span>
        <span class="big">${r.d30_incidents}<small>${esc(T("incidentsWord2"))}</small></span>
      </div>
      <div class="meta">${scope}${tr}${fat}${cats}</div>
    </div>`;
  }).join("");
  $$("#cards .card").forEach(el=>{
    const go=()=>{CUR_COUNTRY=el.dataset.country;show("country");};
    el.onclick=go;
    el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} };
  });
}

const num = v => (v === undefined || v === null) ? "–" : v;

function renderTable(){
  const q=$("#q").value.trim(), reg=$("#f-region").value, cat=$("#f-cat").value,
        tr=$("#f-trend").value, st=$("#f-status").value;
  let rows=D.countries.slice();
  if(reg) rows=rows.filter(r=>regionOf(r.country)===reg);
  if(tr) rows=rows.filter(r=>r.trend.label===tr);
  if(st) rows=rows.filter(r=>r.danger_status===st);
  if(cat) rows=rows.filter(r=>select({country:r.country,category:cat}).length>0);
  const scope=$("#f-scope") ? $("#f-scope").value : "COUNTRY";
  if(scope) rows=rows.filter(r=>(r.geo_scope||"COUNTRY")===scope);
  if(q) rows=rows.filter(r=>(r.country+" "+CTRY(r.country)).toLowerCase().includes(q.toLowerCase())
                          || select({country:r.country,text:q}).length>0);

  rows.forEach(r=>{r.chg=r.prev30_incidents?((r.d30_incidents-r.prev30_incidents)/r.prev30_incidents):null;});
  const k=SORT.key;
  rows.sort((a,b)=>{
    let x=k==="country"?CTRY(a.country):k==="chg"?(a.chg??-99):k==="danger_status"?a.danger_status:a[k];
    let y=k==="country"?CTRY(b.country):k==="chg"?(b.chg??-99):k==="danger_status"?b.danger_status:b[k];
    return (typeof x==="string"?x.localeCompare(y,LANG):(x-y))*SORT.dir;
  });

  $("#tbl thead").innerHTML=`<tr>
    <th class="serial"></th><th class="l country" colspan="2" style="text-align:start">${T("basis")}: ${esc(label(WIN))}</th>
    <th class="group" colspan="8">${T("rolling")}</th>
    <th class="group" colspan="${COLS.length}">${T("secCats")} (${esc(label(WIN))})</th>
    <th class="group" colspan="3">${T("currency")}</th></tr><tr>`+
    `<th class="serial">#</th>`+HEAD().map(h=>`<th class="${h.l?"l ":""}${h.cls||""}" data-k="${h.k}"
      ${SORT.key===h.k?`aria-sort="${SORT.dir<0?"descending":"ascending"}"`:""}>${h.t}</th>`).join("")+
    COLS.map(c=>`<th data-k="cat:${c}" ${SORT.key==="cat:"+c?`aria-sort="${SORT.dir<0?"descending":"ascending"}"`:""}>${esc(SHORT[LANG][c])}</th>`).join("")+
    `<th class="l">${T("trend")}</th><th class="l">${T("lastSig")}</th>
     <th class="l">${T("latestEvent")}</th></tr>`;

  $("#tbl tbody").innerHTML = rows.length? rows.map((r,_ix)=>{
    const counts=Object.fromEntries(COLS.map(c=>[c,select({country:r.country,category:c}).length]));
    const ls=r.last_significant;
    return `<tr>
      <td class="serial num">${_ix+1}</td>
      <td class="l country"><button class="linkbtn" data-country="${esc(r.country)}">${esc(CTRY(r.country))}</button></td>
      <td class="l dstat">${statusCell(r)}</td>
      <td class="num">${num(r.d1_incidents)}</td>
      <td class="num">${num(r.d7_incidents)}</td><td class="num">${r.d30_incidents}</td>
      <td class="num">${r.prev30_covered?r.prev30_incidents:`<span class="badge est" title="${T("noCovHint")}">${T("noCoverage")}</span>`}</td>
      <td class="num delta ${r.prev30_covered&&r.chg>0?"pos":r.prev30_covered&&r.chg<0?"neg":""}">${!r.prev30_covered?"&ndash;":r.chg===null?"&ndash;":(r.chg>0?"+":"")+Math.round(r.chg*100)+"%"}</td>
      <td class="num">${r.d90_incidents}</td>
      <td class="num">${r.d30_fatalities}</td><td class="num">${r.d90_fatalities}</td>`+
      COLS.map(c=>`<td class="num"><span class="cnt ${sevClass(counts[c])}"
        ${counts[c]?`data-drill="${esc(r.country)}|${c}" tabindex="0" role="button"
        title="${T("openCount").replace('%',counts[c])}"`:""}>${counts[c]}</span></td>`).join("")+
      `<td class="l trend ${trCls(r.trend.label)}">${trLabel(r.trend)}</td>
       <td class="l">${ls?`<button class="linkbtn" data-inc="${esc(ls.incident_id)}">${esc((ls.title||"").slice(0,58))}</button>
          <span class="badge">${esc(ls.date)}</span>`:'<span style="color:#b9c1c9">${T("noneInWindow")}</span>'}</td>
       <td class="l">${esc(r.latest_event_date||"&ndash;")}</td></tr>`;
  }).join("") : `<tr><td colspan="26" class="empty">${T("noCountries")}</td></tr>`;

  $("#rowcount").textContent=`${rows.length} ${T("countriesWord")} \u00b7 ${D.meta.total_incidents} ${T("incidentsWord")}`;
  renderCards(rows);
  renderSources();
  wire();
}
const trCls=l=>l==="SIGNIFICANT ESCALATION"?"t-esc":l==="DETERIORATING"?"t-up":l==="IMPROVING"?"t-down":"t-flat";
const NOCOV="INSUFFICIENT HISTORY";
/* Rebuildable: fillSelect() replaces <option>s and setLang() retranslates them,
   so this reads the native element every time rather than caching. */
function enhanceSelects(){
  $$("select").forEach(nat=>{
    let box = nat._sel;
    if(!box){
      nat.classList.add("enhanced");
      box=document.createElement("div");
      box.className="sel";
      box.innerHTML=`<button type="button" class="sel-btn" aria-haspopup="listbox"
        aria-expanded="false"><span class="cv"></span><span class="cx"></span></button>
        <div class="sel-menu" role="listbox" tabindex="-1"></div>`;
      nat.parentNode.insertBefore(box,nat);
      box.appendChild(nat);
      nat._sel=box;
      const btn=box.querySelector(".sel-btn");
      btn.onclick=e=>{e.stopPropagation();toggleSel(box);};
      btn.onkeydown=e=>{
        if(e.key==="ArrowDown"||e.key==="Enter"||e.key===" "){e.preventDefault();toggleSel(box,true);}
      };
      box.querySelector(".sel-menu").onkeydown=e=>menuKeys(e,box);
    }
    syncSel(box);
  });
}

function resyncSelects(){
  $$("select").forEach(nat=>{ if(nat._sel) syncSel(nat._sel); });
}

function syncSel(box){
  const nat=box.querySelector("select"), menu=box.querySelector(".sel-menu");
  box.querySelector(".cv").textContent =
    nat.selectedIndex>=0 ? nat.options[nat.selectedIndex].textContent : "";
  menu.innerHTML=[...nat.options].map((o,ix)=>
    `<div class="sel-opt" role="option" data-ix="${ix}"
      aria-selected="${o.selected}"><span class="tick">✓</span>
      <span>${esc(o.textContent)}</span></div>`).join("");
  menu.querySelectorAll(".sel-opt").forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      nat.selectedIndex=Number(el.dataset.ix);
      // Both events, in the order a browser emits them for a real selection.
      // The toolbar binds "input" and the country/map selects bind "change";
      // sending only one silently disabled half the filters.
      nat.dispatchEvent(new Event("input",{bubbles:true}));
      nat.dispatchEvent(new Event("change",{bubbles:true}));
      syncSel(box); closeSel(box);
      box.querySelector(".sel-btn").focus();
    };
  });
}

function closeSel(b){ b.dataset.open="false";
  b.querySelector(".sel-btn").setAttribute("aria-expanded","false"); }

function toggleSel(box,force){
  const open = force || box.dataset.open!=="true";
  $$(".sel").forEach(b=>{ if(b!==box) closeSel(b); });
  box.dataset.open = open ? "true" : "false";
  box.querySelector(".sel-btn").setAttribute("aria-expanded", open?"true":"false");
  if(open){
    const cur=box.querySelector(".sel-opt[aria-selected=true]")||box.querySelector(".sel-opt");
    if(cur){ cur.classList.add("active");
      if(cur.scrollIntoView) cur.scrollIntoView({block:"nearest"}); }
    box.querySelector(".sel-menu").focus();
  }
}

function menuKeys(e,box){
  const opts=[...box.querySelectorAll(".sel-opt")];
  let i=opts.findIndex(o=>o.classList.contains("active"));
  if(e.key==="Escape"){ closeSel(box); box.querySelector(".sel-btn").focus(); e.preventDefault(); }
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    opts.forEach(o=>o.classList.remove("active"));
    i = e.key==="ArrowDown" ? Math.min(i+1,opts.length-1) : Math.max(i-1,0);
    opts[i].classList.add("active");
    if(opts[i].scrollIntoView) opts[i].scrollIntoView({block:"nearest"});
  }
  else if(e.key==="Enter"||e.key===" "){ e.preventDefault(); if(i>=0) opts[i].click(); }
}

document.addEventListener("click",()=>$$(".sel").forEach(closeSel));

function detectArabicFont(){
  // Width comparison: if the named font is absent the browser silently uses the
  // generic, and the measured width matches. Cheap and needs no font loading API.
  try{
    const c=document.createElement("canvas").getContext("2d");
    const probe="ابجدهوزحطي";
    c.font='72px monospace';           const base=c.measureText(probe).width;
    c.font='72px "Sakkal Majalla", monospace';
    document.documentElement.dataset.majalla =
      (c.measureText(probe).width !== base) ? "1" : "0";
  }catch(e){ document.documentElement.dataset.majalla = "0"; }
}

function localStamp(iso){
  if(!iso) return "–";
  const d=new Date(iso);
  if(isNaN(d)) return iso;
  // Locale-aware, in the reader's own timezone, with the zone named so a
  // reader in another office knows which clock this is.
  try{
    return new Intl.DateTimeFormat(LANG==="ar"?"ar-u-nu-latn":"en-GB",
      {dateStyle:"medium",timeStyle:"short",timeZoneName:"short"}).format(d);
  }catch(e){ return d.toLocaleString(); }
}

  return `<span class="${trCls(t.label)}">${esc(TREND(t.label))}</span>`+
    (pct!=null?` <span style="color:var(--muted);font-weight:400">${pct>0?"+":""}${pct}%</span>`:"");
}

  }).join("")||`<p class="note">${T("noCatInc")} ${esc(label(WIN))}.</p>`;

    el.onclick=go; el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
  });

function km(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,
  h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}
function renderProx(){
  const city=$("#cCity").value, c=CUR_COUNTRY;
  if(!city){$("#cProx").innerHTML="";return}
  const ref=(CITIES[c]||[]).find(x=>x.n===city);
  const items=select({country:c});
  const B=[T("bInside"),T("b025"),T("b25100"),T("bElse"),T("bUnres")];
  const bands={[B[0]]:[],[B[1]]:[],[B[2]]:[],[B[3]]:[],[B[4]]:[]};
  items.forEach(i=>{
    if(i.latitude==null||i.geo_precision===3){bands[B[4]].push(i);return}
    const d=km(ref.lat,ref.lon,i.latitude,i.longitude);
    if(d<8)bands[B[0]].push(i);
    else if(d<25)bands[B[1]].push(i);
    else if(d<100)bands[B[2]].push(i);
    else bands[B[3]].push(i);
  });
  $("#cProx").innerHTML=`<div class="prox">
    <div class="head"><span>${T("proximityTo")} ${esc(city)} &mdash; ${esc(label(WIN))}</span>
      <span>${items.length} ${T("incidentsWord2")}</span></div>
    ${Object.entries(bands).map(([k,v])=>`<div class="row ${k===B[4]?"unres":""}"
      data-band="${esc(k)}"><span>${esc(k)}</span>
      <span class="num"><b>${v.length}</b>${v.length?` &nbsp;<span style="color:var(--muted)">${v.reduce((s,i)=>s+(i.fatalities||0),0)} ${T("killed")}</span>`:""}</span></div>`).join("")}
    </div>
<p class="note">${T("proxNote").replace(/%/g,esc(city))}</p>`;
  $$("#cProx .row").forEach(el=>el.onclick=()=>{
    const list=bands[el.dataset.band];
    openPanel({trail:[T("world"),CTRY(c),el.dataset.band],
      title:`${esc(city)} &mdash; ${esc(el.dataset.band)}`,
      audit:T("auditProx")(list.length,esc(city),esc(label(WIN))),
      body:list.length?list.map(incCard).join(""):`<div class="empty">${T("noneBand")}</div>`});
    $$("#pBody .inc").forEach(x=>x.onclick=()=>openIncident(
      D.incidents.find(i=>i.incident_id===x.dataset.id)));
  });
}

function mapUnavailable(){
  const el=$("#map");

function renderMap(){
  if(!MAP) return;
  LAYER.clearLayers();
  const items=select({country:$("#m-country").value||null,category:$("#m-cat").value||null,
    win:$("#m-win").value,fatalOnly:$("#m-fatal").checked});
  let plotted=0,skipped=0;
  items.forEach(i=>{
    if(i.latitude==null||i.longitude==null||i.geo_precision===3){skipped++;return}
    plotted++;
    const f=i.fatalities||0, r=Math.min(20,5+Math.sqrt(f)*1.9);
    L.circleMarker([i.latitude,i.longitude],{radius:r,weight:1.5,color:"#7d241a",
      fillColor:f>=10?"#8d2020":f>0?"#c04f2c":"#dd8434",fillOpacity:.62})
      .bindPopup(`<h3 class="en">${esc(i.title||"")}</h3>
        <div>${esc(i.event_date)} &middot; ${esc(i.location||i.admin1||CTRY(i.country))}</div>
        <div><b>${esc(CAT(i.security_category))}</b>${i.security_subtype?" &middot; "+esc(i.security_subtype):""}</div>
        <div>${(i.actors||[]).map(a=>esc(a.name)).join(" / ")||T("actorsNR")}</div>
        <div>${f} ${T("killed")}</div>
        ${(i.sources||[])[0]?`<div><a href="${esc(i.sources[0].url)}" target="_blank" rel="noopener">${esc(i.sources[0].domain)}</a></div>`:""}
        <div style="margin-top:5px"><a href="#" data-pop="${esc(i.incident_id)}">${T("openFull")}</a></div>`)
      .addTo(LAYER);
  });
  $("#m-count").innerHTML=`${plotted} ${T("plotted")}`+
    (skipped?` &middot; <span style="color:var(--up)">${skipped} ${T("withheld")}</span>`:"");
  MAP.off("popupopen").on("popupopen",e=>{
    const a=e.popup.getElement().querySelector("[data-pop]");
    if(a) a.onclick=ev=>{ev.preventDefault();
      openIncident(D.incidents.find(i=>i.incident_id===a.dataset.pop))};
  });
}

/* ---------- boot ---------- */
function fillSelect(el,vals,all){el.innerHTML=`<option value="">${all}</option>`+
  vals.map(v=>`<option value="${esc(v.v)}">${esc(v.t)}</option>`).join("")}
function boot(data){
  D=data;
  if(typeof detectArabicFont==='function') detectArabicFont();
  applyStatic();
  renderStatus();
  const regions=[...new Set(D.incidents.map(i=>i.region).filter(Boolean))].sort();
  D.incidents.forEach(i=>{if(i.region)REGION[i.country]=i.region});
  fillSelect($("#f-region"),regions.map(r=>({v:r,t:REG(r)})),T("allRegions"));
  const catOpts=COLS.filter(c=>D.categories[c]).map(c=>({v:c,t:CAT(c)}));
  fillSelect($("#f-cat"),catOpts,T("allCats"));
  fillSelect($("#m-cat"),catOpts,T("allCats"));
  fillSelect($("#m-country"),D.countries.map(c=>({v:c.country,t:CTRY(c.country)}))
    .sort((a,b)=>a.t.localeCompare(b.t,LANG)),T("allCountriesOpt"));
  fillSelect($("#f-status"),[...new Set(D.countries.map(c=>c.danger_status))].map(s=>({v:s,t:s})),T("all"));
  ["#q","#f-region","#f-cat","#f-trend","#f-status","#f-scope"].forEach(s=>{
    $(s).addEventListener("input",renderTable)});
  $$(".winsel button").forEach(b=>b.onclick=()=>{
    WIN=b.dataset.win;
    $$(".winsel button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    renderTable(); if(VIEW==="country")renderCountry();
  });
  $("#backGlobal").onclick=()=>show("global");
  ["#cCat","#cCity"].forEach(s=>$(s).addEventListener("change",renderCountry));
  enhanceSelects();
  ["#m-country","#m-cat","#m-win","#m-fatal"].forEach(s=>$(s).addEventListener("change",renderMap));
  renderTable();
}
(async()=>{
  if(INLINE_DATA) return boot(INLINE_DATA);
  try{ boot(await (await fetch("data.json")).json()); }
  catch(e){ document.body.innerHTML=
    `<div class="empty">${T("loadFail")}<br>
     <code>python -m pipeline.run_pipeline --seed</code></div>`; }
})();
</script>
</body>
