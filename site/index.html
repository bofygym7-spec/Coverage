<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Security &amp; Danger Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --canvas:#eceff3; --surface:#fff; --surface-2:#f6f8fa;
  --ink:#151a21; --ink-2:#3d4854; --muted:#69737f; --rule:#d2d8df; --rule-2:#e5e9ee;
  --accent:#17497a; --accent-soft:#e7eef6;
  --s1:#e8b44a; --s2:#dd8434; --s3:#c04f2c; --s4:#8d2020;
  --up:#a8342a; --down:#1c6f52; --flat:#69737f;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--canvas); color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}

/* ---- status strip ---------------------------------------------------- */
.status{
  display:flex;flex-wrap:wrap;align-items:stretch;gap:0;
  background:var(--ink);color:#fff;border-bottom:3px solid var(--accent);
}
.status .brand{padding:11px 18px;font-weight:650;letter-spacing:.01em;font-size:14px;
  border-right:1px solid #2c3540;display:flex;align-items:center;gap:9px}
.status .brand span{font-weight:400;color:#93a0ae;font-size:11.5px}
.stat{padding:9px 18px;border-right:1px solid #2c3540;min-width:132px}
.stat b{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.stat i{display:block;font-style:normal;font-size:10.5px;color:#93a0ae;margin-bottom:2px;
  letter-spacing:.02em}
.stat.warn b{color:#ffc96b}
.status .spacer{flex:1;border:0}
.viewtabs{display:flex;align-items:stretch}
.viewtabs button{padding:0 17px;color:#b6c0cb;font-size:12.5px;border-left:1px solid #2c3540}
.viewtabs button[aria-selected=true]{background:var(--accent);color:#fff;font-weight:600}

/* ---- toolbar --------------------------------------------------------- */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--rule)}
.toolbar label{font-size:11px;color:var(--muted);margin-right:-4px}
input[type=search],select{
  border:1px solid var(--rule);background:var(--surface);border-radius:2px;
  padding:5px 7px;font:inherit;font-size:12px;color:var(--ink);min-height:28px}
input[type=search]{min-width:210px}
input:focus-visible,select:focus-visible,button:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.winsel{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.winsel button{padding:5px 11px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--rule)}
.winsel button:last-child{border-right:0}
.winsel button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
.pill{margin-left:auto;font-size:11.5px;color:var(--muted)}
.linkbtn{color:var(--accent);font-size:12px;text-decoration:underline}

/* ---- table ----------------------------------------------------------- */
.tablewrap{overflow:auto;height:calc(100vh - 108px);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
thead th{
  position:sticky;top:0;z-index:3;background:var(--surface-2);
  border-bottom:1px solid var(--rule);border-right:1px solid var(--rule-2);
  padding:6px 8px;text-align:right;font-weight:600;font-size:11px;color:var(--ink-2);
  white-space:nowrap;cursor:pointer;vertical-align:bottom}
thead th.l{text-align:left}
thead th .sub{display:block;font-weight:400;color:var(--muted);font-size:10px}
thead th[aria-sort]:after{content:"";margin-left:4px;opacity:.75}
thead th[aria-sort=descending]:after{content:"\25BE"}
thead th[aria-sort=ascending]:after{content:"\25B4"}
th.group{text-align:center;font-size:10px;color:var(--muted);text-transform:none;
  background:var(--surface);border-bottom:1px solid var(--rule-2)}
tbody td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--rule-2);
  border-right:1px solid var(--rule-2);white-space:nowrap}
tbody td.l{text-align:left}
tbody tr:hover{background:#f2f6fa}
td.country{position:sticky;left:0;background:var(--surface);z-index:2;
  border-right:1px solid var(--rule);font-weight:600}
tbody tr:hover td.country{background:#f2f6fa}
thead th.country{position:sticky;left:0;z-index:4}
.cnt{display:inline-block;min-width:22px;padding:1px 5px;border-radius:2px;
  text-decoration:none;color:var(--ink);cursor:pointer}
.cnt:hover{background:var(--accent);color:#fff}
.cnt.zero{color:#b9c1c9;cursor:default}
.cnt.zero:hover{background:none;color:#b9c1c9}
.sev1{background:#fbf0d8}.sev2{background:#f8e0c4}.sev3{background:#f2cdbe}.sev4{background:#e9b8b0}
.trend{font-size:11px;font-weight:600;white-space:nowrap}
.t-up{color:var(--up)}.t-down{color:var(--down)}.t-flat{color:var(--flat)}
.t-esc{color:#fff;background:var(--up);padding:1px 6px;border-radius:2px}
.status-tag{font-size:10.5px;letter-spacing:.03em;color:var(--muted);
  border:1px solid var(--rule);padding:1px 6px;border-radius:2px}
.delta.pos{color:var(--up)}.delta.neg{color:var(--down)}

/* ---- drill-down panel ------------------------------------------------ */
.scrim{position:fixed;inset:0;background:rgba(20,26,33,.42);opacity:0;pointer-events:none;
  transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);background:var(--surface);
  border-left:1px solid var(--rule);z-index:50;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .2s cubic-bezier(.3,.7,.3,1);
  box-shadow:-8px 0 28px rgba(20,26,33,.16)}
.panel.on{transform:none}
.panel header{padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.panel header h2{margin:0;font-size:15px;font-weight:650}
.panel .body{overflow:auto;padding:14px 16px;flex:1}
.close{position:absolute;top:9px;right:12px;font-size:20px;color:var(--muted);line-height:1;
  padding:4px 8px}
.trail{font-size:10.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em;
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding-right:34px}
.trail b{color:var(--accent);font-weight:600}
.trail .sep{color:#adb6c0}
.audit{background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:8px 11px;font-size:11.5px;color:var(--ink-2);margin-bottom:12px}

.inc{border:1px solid var(--rule-2);border-left:3px solid var(--rule);
  padding:9px 11px;margin-bottom:9px;background:var(--surface);cursor:pointer}
.inc:hover{border-left-color:var(--accent);background:var(--surface-2)}
.inc h3{margin:0 0 3px;font-size:13px;font-weight:600;line-height:1.35}
.inc .meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:7px}
.inc .sum{font-size:11.5px;color:var(--ink-2);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:10px;padding:1px 5px;border-radius:2px;background:var(--surface-2);
  border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.badge.fat{background:#f7e4e1;border-color:#e3bdb6;color:#7d241a}
.badge.merged{background:#e7eef6;border-color:#bcd0e4;color:var(--accent)}
.badge.unver{background:#fbf3dd;border-color:#e3d3a3;color:#7a5c12}
.badge.est{background:#eef1f4;color:var(--muted)}

dl.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;margin:0 0 14px;font-size:12px}
dl.kv dt{color:var(--muted);font-size:11px}
dl.kv dd{margin:0;word-break:break-word}
h4.sec{font-size:11px;color:var(--muted);font-weight:600;margin:16px 0 7px;
  padding-bottom:4px;border-bottom:1px solid var(--rule-2)}
ul.srcs{list-style:none;padding:0;margin:0;font-size:12px}
ul.srcs li{padding:5px 0;border-bottom:1px solid var(--rule-2)}
ul.srcs .dom{color:var(--muted);font-size:10.5px;font-family:var(--mono)}
.evbox{background:var(--surface-2);border:1px solid var(--rule-2);padding:8px 10px;
  font-size:11px;font-family:var(--mono);white-space:pre-wrap;color:var(--ink-2);
  max-height:220px;overflow:auto}
.rationale{font-size:11.5px;color:var(--ink-2);margin:0;padding-left:16px}
.rationale li{margin-bottom:3px}

/* ---- country + map views -------------------------------------------- */
.view{display:none}.view.on{display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
  background:var(--rule-2);border:1px solid var(--rule-2);margin-bottom:14px}
.cgrid div{background:var(--surface);padding:9px 11px}
.cgrid b{display:block;font-size:19px;font-weight:600;line-height:1.15}
.cgrid i{font-style:normal;font-size:10.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:11.5px}
.bar .lab{width:186px;color:var(--ink-2)}
.bar .track{flex:1;height:13px;background:var(--surface-2);position:relative}
.bar .fill{height:100%;background:var(--accent)}
.bar .n{width:34px;text-align:right;font-weight:600}
#map{height:calc(100vh - 152px);background:#dfe4ea}
.maptools{display:flex;gap:9px;flex-wrap:wrap;padding:9px 14px;background:var(--surface);
  border-bottom:1px solid var(--rule);align-items:center}
.leaflet-popup-content{margin:9px 11px;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.leaflet-popup-content h3{margin:0 0 4px;font-size:12.5px}
.prox{border:1px solid var(--rule-2);margin-bottom:12px}
.prox .head{background:var(--surface-2);padding:6px 10px;font-size:11px;font-weight:600;
  border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between}
.prox .row{padding:5px 10px;font-size:12px;display:flex;justify-content:space-between;
  border-bottom:1px solid var(--rule-2);cursor:pointer}
.prox .row:hover{background:var(--surface-2)}
.prox .row:last-child{border:0}
.prox .row.unres{color:var(--muted);font-style:italic}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.note{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.5}
@media(max-width:760px){
  .tablewrap{height:auto;max-height:none}
  dl.kv{grid-template-columns:1fr}
  .status .brand{width:100%;border-right:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="status" id="status"></div>

<!-- ============ GLOBAL VIEW ============ -->
<section class="view on" id="v-global">
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search country or incident text" aria-label="Search">
    <label for="f-region">Region</label><select id="f-region"></select>
    <label for="f-cat">Category</label><select id="f-cat"></select>
    <label for="f-trend">Trend</label><select id="f-trend">
      <option value="">All</option><option>SIGNIFICANT ESCALATION</option>
      <option>DETERIORATING</option><option>STABLE</option><option>IMPROVING</option><option>INSUFFICIENT HISTORY</option>
    </select>
    <label for="f-status">Danger</label><select id="f-status"><option value="">All</option></select>
    <div class="winsel" role="group" aria-label="Counting window">
      <button data-win="d7">7 days</button>
      <button data-win="d30" aria-pressed="true">30 days</button>
      <button data-win="d90">90 days</button>
      <button data-win="all">Full store</button>
    </div>
    <span class="pill" id="rowcount"></span>
  </div>
  <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
</section>

<!-- ============ COUNTRY VIEW ============ -->
<section class="view" id="v-country">
  <div class="toolbar">
    <button class="linkbtn" id="backGlobal">&larr; All countries</button>
    <strong id="cName" style="font-size:14px"></strong>
    <span class="status-tag" id="cStatus"></span>
    <span id="cTrend"></span>
    <label for="cCat" style="margin-left:12px">Category</label>
    <select id="cCat"></select>
    <label for="cCity">Proximity to</label>
    <select id="cCity"><option value="">— select a city —</option></select>
    <span class="pill" id="cCount"></span>
  </div>
  <div style="padding:14px;overflow:auto;height:calc(100vh - 152px)">
    <div class="cgrid" id="cStats"></div>
    <div id="cProx"></div>
    <h4 class="sec">Category distribution &mdash; click any bar to audit the incidents behind it</h4>
    <div id="cBars"></div>
    <h4 class="sec">Incidents in the selected window</h4>
    <div id="cList"></div>
  </div>
</section>

<!-- ============ MAP VIEW ============ -->
<section class="view" id="v-map">
  <div class="maptools">
    <label for="m-country">Country</label><select id="m-country"></select>
    <label for="m-cat">Category</label><select id="m-cat"></select>
    <label for="m-win">Window</label><select id="m-win">
      <option value="d7">7 days</option><option value="d30" selected>30 days</option>
      <option value="d90">90 days</option><option value="all">Full store</option>
    </select>
    <label><input type="checkbox" id="m-fatal"> Fatal incidents only</label>
    <span class="pill" id="m-count"></span>
  </div>
  <div id="map"></div>
</section>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <header>
    <div class="trail" id="pTrail"></div>
    <h2 id="pTitle"></h2>
    <button class="close" id="pClose" aria-label="Close">&times;</button>
  </header>
  <div class="body" id="pBody"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const INLINE_DATA = /*__DATA__*/ null;

/* Reference cities for proximity analysis. Coordinates are used only to measure
   distance to incidents that carry real coordinates of their own. */
const CITIES = {
  Lebanon:[{n:"Beirut",lat:33.8938,lon:35.5018}],
  Ukraine:[{n:"Kyiv",lat:50.4501,lon:30.5234},{n:"Kharkiv",lat:49.9935,lon:36.2304}],
  Yemen:[{n:"Sanaa",lat:15.3694,lon:44.1910},{n:"Aden",lat:12.7855,lon:45.0187}],
  Iran:[{n:"Tehran",lat:35.6892,lon:51.3890}],
  Russia:[{n:"Moscow",lat:55.7558,lon:37.6173}],
  Palestine:[{n:"Gaza City",lat:31.5017,lon:34.4668}],
  Somalia:[{n:"Mogadishu",lat:2.0469,lon:45.3182}],
  Iraq:[{n:"Baghdad",lat:33.3152,lon:44.3661}],
  "Saudi Arabia":[{n:"Riyadh",lat:24.7136,lon:46.6753}],
  Oman:[{n:"Muscat",lat:23.5880,lon:58.3829}]
};
const COLS = ["ARMED_CONFLICT","AIR_MISSILE_DRONE","TERRORISM_IED","VIOLENCE_AGAINST_CIVILIANS",
  "KIDNAPPING","VIOLENT_UNREST","ARMED_GROUPS","FOREIGN_DIPLOMATIC_TARGET",
  "TRANSPORT_ACCESS_DISRUPTION","STATE_CONTROL_BREAKDOWN","OTHER_SERIOUS_THREAT"];
const SHORT = {ARMED_CONFLICT:"Battles",AIR_MISSILE_DRONE:"Air / missile",
  TERRORISM_IED:"Terror / IED",VIOLENCE_AGAINST_CIVILIANS:"Civilians",KIDNAPPING:"Kidnap",
  VIOLENT_UNREST:"Unrest",ARMED_GROUPS:"Armed groups",FOREIGN_DIPLOMATIC_TARGET:"Foreign / dipl.",
  TRANSPORT_ACCESS_DISRUPTION:"Transport",STATE_CONTROL_BREAKDOWN:"State control",
  OTHER_SERIOUS_THREAT:"Other"};

let D=null, WIN="d30", VIEW="global", CUR_COUNTRY=null, MAP=null, LAYER=null;
let SORT={key:"d30_incidents",dir:-1};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- window arithmetic, identical to the pipeline ---------- */
function bounds(win){
  const as=new Date(D.meta.as_of+"T00:00:00Z"), d=n=>{const x=new Date(as);x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)};
  if(win==="all") return [D.meta.coverage_start, D.meta.as_of];
  return [{d7:d(6),d30:d(29),d90:d(89)}[win], D.meta.as_of];
}
const inWin=(dt,win)=>{const[a,b]=bounds(win);return dt&&dt>=a&&dt<=b};
function label(win){return {d7:"last 7 days",d30:"last 30 days",d90:"last 90 days",
  all:"full stored history"}[win]}

/* Single source of truth: the table, the drill-down and the map all call this,
   so a displayed number and its underlying list can never disagree. */
function select({country=null,category=null,win=WIN,fatalOnly=false,text=null,overlay=false}={}){
  return D.incidents.filter(i=>{
    if(country && i.country!==country) return false;
    if(category){
      const hit = overlay ? (i.overlay_categories||[]).includes(category)
                          : i.security_category===category;
      if(!hit) return false;
    }
    if(!inWin(i.event_date,win)) return false;
    if(fatalOnly && !(i.fatalities>0)) return false;
    if(text){const t=text.toLowerCase();
      if(!((i.title||"")+" "+(i.summary||"")+" "+(i.location||"")).toLowerCase().includes(t)) return false;}
    return true;
  }).sort((a,b)=>(b.event_date||"").localeCompare(a.event_date||"")
      || (b.significance||0)-(a.significance||0));
}
const sevClass=n=>n===0?"zero":n<3?"sev1":n<8?"sev2":n<20?"sev3":"sev4";

/* ---------- status strip ---------- */
function renderStatus(){
  const m=D.meta, stale=m.latest_event_date && m.latest_event_date < bounds("d7")[0];
  $("#status").innerHTML=`
    <div class="brand">Global Security &amp; Danger Dashboard <span>GDELT Cloud</span></div>
    <div class="stat"><i>Last refresh</i><b>${esc((m.last_refresh||"").replace("T"," ").replace("+00:00"," UTC"))}</b></div>
    <div class="stat ${stale?"warn":""}"><i>Latest event date</i><b>${esc(m.latest_event_date||"none")}</b></div>
    <div class="stat"><i>Data coverage start</i><b>${esc(m.coverage_start)}</b></div>
    <div class="stat"><i>Incidents in store</i><b class="num">${m.total_incidents.toLocaleString()}</b></div>
    <div class="stat"><i>Raw GDELT events</i><b class="num">${m.total_raw_events.toLocaleString()}</b></div>
    <div class="spacer"></div>
    <div class="viewtabs">
      <button data-view="global" aria-selected="true">Global</button>
      <button data-view="country" aria-selected="false">Country</button>
      <button data-view="map" aria-selected="false">Map</button>
    </div>`;
  $$("#status .viewtabs button").forEach(b=>b.onclick=()=>{
    if(b.dataset.view==="country" && !CUR_COUNTRY){
      CUR_COUNTRY=(D.countries[0]||{}).country; }
    show(b.dataset.view);
  });
}
function show(v){
  VIEW=v;
  $$(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $$("#status .viewtabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  if(v==="country") renderCountry();
  if(v==="map"){ setTimeout(()=>{initMap();renderMap();},30); }
}

/* ---------- global table ---------- */
const HEAD=[
  {k:"country",t:"Country",l:1,cls:"country"},
  {k:"danger_status",t:"Danger status",l:1},
  {k:"d7_incidents",t:"7d"},{k:"d30_incidents",t:"30d"},
  {k:"prev30_incidents",t:"Prev 30d"},{k:"chg",t:"30d change"},
  {k:"d90_incidents",t:"90d"},
  {k:"d30_fatalities",t:"30d fatal."},{k:"d90_fatalities",t:"90d fatal."}
];
function renderTable(){
  const q=$("#q").value.trim(), reg=$("#f-region").value, cat=$("#f-cat").value,
        tr=$("#f-trend").value, st=$("#f-status").value;
  let rows=D.countries.slice();
  if(reg) rows=rows.filter(r=>regionOf(r.country)===reg);
  if(tr) rows=rows.filter(r=>r.trend.label===tr);
  if(st) rows=rows.filter(r=>r.danger_status===st);
  if(cat) rows=rows.filter(r=>select({country:r.country,category:cat}).length>0);
  if(q) rows=rows.filter(r=>r.country.toLowerCase().includes(q.toLowerCase())
                          || select({country:r.country,text:q}).length>0);

  rows.forEach(r=>{r.chg=r.prev30_incidents?((r.d30_incidents-r.prev30_incidents)/r.prev30_incidents):null;});
  const k=SORT.key;
  rows.sort((a,b)=>{
    let x=k==="country"?a.country:k==="chg"?(a.chg??-99):k==="danger_status"?a.danger_status:a[k];
    let y=k==="country"?b.country:k==="chg"?(b.chg??-99):k==="danger_status"?b.danger_status:b[k];
    return (typeof x==="string"?x.localeCompare(y):(x-y))*SORT.dir;
  });

  $("#tbl thead").innerHTML=`<tr>
    <th class="l country" colspan="2" style="text-align:left">Reporting basis: ${esc(label(WIN))}</th>
    <th class="group" colspan="7">Rolling windows</th>
    <th class="group" colspan="${COLS.length}">Security categories &mdash; counts are clickable and open the incidents behind them (${esc(label(WIN))})</th>
    <th class="group" colspan="3">Currency</th></tr><tr>`+
    HEAD.map(h=>`<th class="${h.l?"l ":""}${h.cls||""}" data-k="${h.k}"
      ${SORT.key===h.k?`aria-sort="${SORT.dir<0?"descending":"ascending"}"`:""}>${h.t}</th>`).join("")+
    COLS.map(c=>`<th data-k="cat:${c}" ${SORT.key==="cat:"+c?`aria-sort="${SORT.dir<0?"descending":"ascending"}"`:""}>${esc(SHORT[c])}</th>`).join("")+
    `<th class="l">Trend</th><th class="l">Last significant incident</th>
     <th class="l">Latest event</th></tr>`;

  $("#tbl tbody").innerHTML = rows.length? rows.map(r=>{
    const counts=Object.fromEntries(COLS.map(c=>[c,select({country:r.country,category:c}).length]));
    const ls=r.last_significant;
    return `<tr>
      <td class="l country"><button class="linkbtn" data-country="${esc(r.country)}">${esc(r.country)}</button></td>
      <td class="l"><span class="status-tag">${esc(r.danger_status)}</span></td>
      <td class="num">${r.d7_incidents}</td><td class="num">${r.d30_incidents}</td>
      <td class="num">${r.prev30_covered?r.prev30_incidents:'<span class="badge est" title="This period has not been ingested yet. It is not zero events.">no coverage</span>'}</td>
      <td class="num delta ${r.prev30_covered&&r.chg>0?"pos":r.prev30_covered&&r.chg<0?"neg":""}">${!r.prev30_covered?"&ndash;":r.chg===null?"&ndash;":(r.chg>0?"+":"")+Math.round(r.chg*100)+"%"}</td>
      <td class="num">${r.d90_incidents}</td>
      <td class="num">${r.d30_fatalities}</td><td class="num">${r.d90_fatalities}</td>`+
      COLS.map(c=>`<td class="num"><span class="cnt ${sevClass(counts[c])}"
        ${counts[c]?`data-drill="${esc(r.country)}|${c}" tabindex="0" role="button"
        title="Open the ${counts[c]} incident(s) counted here"`:""}>${counts[c]}</span></td>`).join("")+
      `<td class="l trend ${trCls(r.trend.label)}">${trLabel(r.trend)}</td>
       <td class="l">${ls?`<button class="linkbtn" data-inc="${esc(ls.incident_id)}">${esc((ls.title||"").slice(0,58))}</button>
          <span class="badge">${esc(ls.date)}</span>`:'<span style="color:#b9c1c9">none in window</span>'}</td>
       <td class="l">${esc(r.latest_event_date||"&ndash;")}</td></tr>`;
  }).join("") : `<tr><td colspan="24" class="empty">No countries match these filters.</td></tr>`;

  $("#rowcount").textContent=`${rows.length} countries \u00b7 ${D.meta.total_incidents} incidents in store`;
  wire();
}
const trCls=l=>l==="SIGNIFICANT ESCALATION"?"t-esc":l==="DETERIORATING"?"t-up":l==="IMPROVING"?"t-down":"t-flat";
const NOCOV="INSUFFICIENT HISTORY";
function trLabel(t){
  const pct=t.severity_change_pct;
  if(t.label===NOCOV) return `<span class="badge est" title="${esc(t.basis||"")}">insufficient history</span>`;
  return `<span class="${trCls(t.label)}">${esc(t.label)}</span>`+
    (pct!=null?` <span style="color:var(--muted);font-weight:400">${pct>0?"+":""}${pct}%</span>`:"");
}
function regionOf(c){const i=D.incidents.find(x=>x.country===c);return (i&&i.region)||REGION[c]||"Other";}
const REGION={};

function wire(){
  $$("[data-drill]").forEach(el=>{
    const go=()=>{const[c,cat]=el.dataset.drill.split("|");drillCategory(c,cat)};
    el.onclick=go; el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
  });
  $$("[data-country]").forEach(el=>el.onclick=()=>{CUR_COUNTRY=el.dataset.country;show("country")});
  $$("[data-inc]").forEach(el=>el.onclick=e=>{e.stopPropagation();
    openIncident(D.incidents.find(i=>i.incident_id===el.dataset.inc))});
  $$("#tbl thead th[data-k]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(k.startsWith("cat:")){
      const c=k.slice(4);
      D.countries.forEach(r=>r["cat:"+c]=select({country:r.country,category:c}).length);
    }
    SORT = SORT.key===k?{key:k,dir:-SORT.dir}:{key:k,dir:-1};
    renderTable();
  });
}

/* ---------- drill-down: category -> incidents ---------- */
function drillCategory(country,cat){
  const list=select({country,category:cat});
  const [a,b]=bounds(WIN);
  openPanel({
    trail:[`World`,country,D.categories[cat].label],
    title:`${country} &mdash; ${esc(D.categories[cat].label)}`,
    audit:`These are the exact <b>${list.length}</b> incident(s) that produce the figure shown in the
      table. Basis: security category <b>${esc(cat)}</b>, event date between <b>${a}</b> and
      <b>${b}</b> (${esc(label(WIN))}), country <b>${esc(country)}</b>. Changing the window in the
      toolbar changes both the count and this list together.`,
    body: list.length? list.map(incCard).join("")
      : `<div class="empty">No incidents in this cell for the selected window.</div>`
  });
  $$("#pBody .inc").forEach(el=>el.onclick=()=>openIncident(
    D.incidents.find(i=>i.incident_id===el.dataset.id)));
}
function incCard(i){
  const merged=i.event_count>1, unver=i.verification_status!=="VERIFIED_MULTI_SOURCE";
  return `<div class="inc" data-id="${esc(i.incident_id)}" tabindex="0">
    <h3>${esc(i.title||"Untitled incident")}</h3>
    <div class="meta">
      <span class="badge">${esc(i.event_date)}</span>
      <span class="badge">${esc(i.location||i.admin1||i.country)}</span>
      ${i.fatalities?`<span class="badge fat">${i.fatalities} killed${i.fatalities_disputed?" (disputed)":""}</span>`:""}
      ${merged?`<span class="badge merged">${i.event_count} GDELT records merged</span>`:""}
      ${unver?`<span class="badge unver">${esc(i.verification_status.replace(/_/g," ").toLowerCase())}</span>`:""}
      ${i.impact_realised?"":`<span class="badge est">intercepted / no impact</span>`}
      ${i.geo_precision===3?`<span class="badge est">geography unresolved</span>`:""}
    </div>
    <div class="sum">${esc(i.summary||"")}</div></div>`;
}

/* ---------- drill-down: incident detail ---------- */
function openIncident(i){
  if(!i) return;
  const ev=i.dedup_evidence||[];
  const acts=(i.actors||[]).map(a=>esc(a.name)+(a.country?` <span style="color:var(--muted)">(${esc(a.country)})</span>`:"")).join(", ");
  const geoTxt = i.latitude!=null && i.geo_precision!==3
    ? `${i.latitude.toFixed(4)}, ${i.longitude.toFixed(4)} <span class="badge">${esc(i.geo_precision_label)}</span>`
    : `<span class="badge est">no usable coordinates &mdash; ${esc(i.geo_precision_label||"unknown precision")}</span>`;
  openPanel({
    trail:["World",i.country,D.categories[i.security_category].label,"Incident"],
    title:esc(i.title||"Incident"),
    audit:`Incident <b>${esc(i.incident_id)}</b> consolidates <b>${i.event_count}</b> GDELT event record(s).
      Every figure below is stored, not derived at display time.`,
    body:`
      <dl class="kv">
        <dt>Date</dt><dd>${esc(i.event_date)}</dd>
        <dt>Country</dt><dd>${esc(i.country)}</dd>
        <dt>Admin region</dt><dd>${esc(i.admin1||"not reported")}</dd>
        <dt>Place</dt><dd>${esc(i.location||"not reported")}</dd>
        <dt>Coordinates</dt><dd>${geoTxt}</dd>
        <dt>Security category</dt><dd><b>${esc(D.categories[i.security_category].label)}</b></dd>
        <dt>Security subtype</dt><dd>${esc(i.security_subtype||"not assigned")}</dd>
        <dt>Overlay flags</dt><dd>${(i.overlay_categories||[]).length?
          i.overlay_categories.map(o=>`<span class="badge">${esc(D.categories[o]?D.categories[o].label:o)}</span>`).join(" "):"none"}</dd>
        <dt>Native GDELT category</dt><dd>${esc(i.native_category)} &rsaquo; ${esc(i.native_subcategory||"")}</dd>
        ${i.category_disputed?`<dt>Category dispute</dt><dd><span class="badge unver">merged records coded differently: ${i.merged_categories.map(esc).join(", ")}</span></dd>`:""}
        <dt>Actors</dt><dd>${acts||"not reported"}</dd>
        <dt>Organizations</dt><dd>${(i.organizations||[]).map(esc).join(", ")||"none linked"}</dd>
        <dt>Reported fatalities</dt><dd>${i.fatalities??"not reported"}${
          i.fatalities_disputed?` <span class="badge unver">sources differ: ${i.fatalities_reported_range.join(" to ")}</span>`:""}</dd>
        <dt>Goldstein scale</dt><dd>${i.goldstein_scale??"not scored"}</dd>
        <dt>Significance</dt><dd>${i.significance??"not scored"}</dd>
        <dt>GDELT confidence</dt><dd>${i.confidence??"not scored"}</dd>
        <dt>Verification</dt><dd>${esc(i.verification_status.replace(/_/g," "))}</dd>
        <dt>Impact realised</dt><dd>${i.impact_realised?"yes":"no &mdash; weapon intercepted or disrupted"}</dd>
        <dt>Corroborating articles</dt><dd>${i.article_count??0}</dd>
      </dl>
      <div id="incmap" style="height:190px;border:1px solid var(--rule-2);${i.latitude==null||i.geo_precision===3?"display:none":""}"></div>
      <h4 class="sec">Summary as coded</h4>
      <p style="font-size:12.5px;margin:0;color:var(--ink-2)">${esc(i.summary||"No summary available.")}</p>

      <h4 class="sec">Contributing GDELT event records (${i.event_count})</h4>
      <ul class="srcs">${i.event_ids.map(e=>`<li><span class="dom">${esc(e)}</span></li>`).join("")}</ul>

      <h4 class="sec">GDELT Cloud stories</h4>
      <ul class="srcs">${(i.story_urls||[]).length? i.story_urls.map(u=>
        `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join("")
        : "<li>No story URL on these records.</li>"}</ul>

      <h4 class="sec">Original source articles (${(i.sources||[]).length})</h4>
      <ul class="srcs">${(i.sources||[]).map(s=>`<li>
        <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a><br>
        <span class="dom">${esc(s.domain||"")} &mdash; via ${esc(s.via_event_id)}</span></li>`).join("")
        || "<li>No source articles attached.</li>"}</ul>

      <h4 class="sec">Deduplication</h4>
      <dl class="kv"><dt>Method</dt><dd>${esc(i.dedup_method)}</dd>
      <dt>Confidence</dt><dd>${i.dedup_confidence}</dd></dl>
      ${ev.length?`<div class="evbox">${esc(JSON.stringify(ev,null,1))}</div>`:
        `<p class="note">Single record; no consolidation was applied.</p>`}
      <p class="note">Raw GDELT records are retained unchanged in <code>raw_events</code>. Consolidation
      creates a new incident row and never overwrites or deletes the originals.</p>`
  });
  if(i.latitude!=null && i.geo_precision!==3){
    setTimeout(()=>{
      const m=L.map("incmap",{attributionControl:false,zoomControl:false}).setView([i.latitude,i.longitude],9);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(m);
      L.circleMarker([i.latitude,i.longitude],{radius:7,color:"#8d2020",fillColor:"#c04f2c",
        fillOpacity:.85,weight:2}).addTo(m);
    },40);
  }
}

/* ---------- panel plumbing ---------- */
function openPanel({trail,title,audit,body}){
  $("#pTrail").innerHTML=trail.map((t,n)=>
    `${n?'<span class="sep">&rsaquo;</span>':""}<b>${esc(t)}</b>`).join(" ")+
    ` <span class="sep">&rsaquo;</span> GDELT event <span class="sep">&rsaquo;</span> source article`;
  $("#pTitle").innerHTML=title;
  $("#pBody").innerHTML=(audit?`<div class="audit">${audit}</div>`:"")+body;
  $("#panel").classList.add("on"); $("#scrim").classList.add("on");
  $("#pBody").scrollTop=0; $("#pClose").focus();
}
function closePanel(){$("#panel").classList.remove("on");$("#scrim").classList.remove("on")}
$("#pClose").onclick=closePanel; $("#scrim").onclick=closePanel;
addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});

/* ---------- country view ---------- */
function renderCountry(){
  const c=CUR_COUNTRY, row=D.countries.find(r=>r.country===c);
  if(!row){$("#cName").textContent="No country selected";return}
  $("#cName").textContent=c;
  $("#cStatus").textContent=row.danger_status;
  $("#cTrend").innerHTML=trLabel(row.trend);

  const cats=[...new Set(D.incidents.filter(i=>i.country===c).map(i=>i.security_category))];
  $("#cCat").innerHTML=`<option value="">All categories</option>`+
    cats.map(k=>`<option value="${k}">${esc(D.categories[k].label)}</option>`).join("");
  $("#cCity").innerHTML=`<option value="">— select a city —</option>`+
    (CITIES[c]||[]).map(x=>`<option value="${x.n}">${esc(x.n)}</option>`).join("");

  $("#cStats").innerHTML=[
    ["7 days",row.d7_incidents],["30 days",row.d30_incidents],
    ["Previous 30 days",row.prev30_incidents],["90 days",row.d90_incidents],
    ["30d fatalities",row.d30_fatalities],["90d fatalities",row.d90_fatalities],
    ["Exact geography",row.geo_quality.exact_pct+"%"],
    ["Latest event",row.latest_event_date||"—"]
  ].map(([l,v])=>`<div><b class="num">${v}</b><i>${l}</i></div>`).join("");

  const sel=$("#cCat").value;
  const items=select({country:c,category:sel||null});
  const max=Math.max(1,...COLS.map(k=>select({country:c,category:k}).length));
  $("#cBars").innerHTML=COLS.map(k=>{
    const n=select({country:c,category:k}).length;
    return n?`<div class="bar"><span class="lab">${esc(D.categories[k].label)}</span>
      <span class="track"><span class="fill" style="width:${100*n/max}%"></span></span>
      <span class="n"><span class="cnt" data-drill="${esc(c)}|${k}" tabindex="0" role="button">${n}</span></span></div>`:"";
  }).join("")||`<p class="note">No categorised incidents for this country in ${esc(label(WIN))}.</p>`;

  $("#cList").innerHTML=items.length?items.map(incCard).join(""):
    `<div class="empty">No incidents for these filters.</div>`;
  $("#cCount").textContent=`${items.length} incidents \u00b7 ${label(WIN)}`;
  renderProx();
  $$("#v-country .inc").forEach(el=>el.onclick=()=>openIncident(
    D.incidents.find(i=>i.incident_id===el.dataset.id)));
  $$("#cBars [data-drill]").forEach(el=>{
    const go=()=>{const[cc,cat]=el.dataset.drill.split("|");drillCategory(cc,cat)};
    el.onclick=go; el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
  });
}
function km(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,
  h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}
function renderProx(){
  const city=$("#cCity").value, c=CUR_COUNTRY;
  if(!city){$("#cProx").innerHTML="";return}
  const ref=(CITIES[c]||[]).find(x=>x.n===city);
  const items=select({country:c});
  const bands={"Inside city (under 8 km)":[],"Approximately 0–25 km":[],
    "Approximately 25–100 km":[],"Elsewhere in country":[],"Geography unresolved":[]};
  items.forEach(i=>{
    if(i.latitude==null||i.geo_precision===3){bands["Geography unresolved"].push(i);return}
    const d=km(ref.lat,ref.lon,i.latitude,i.longitude);
    if(d<8)bands["Inside city (under 8 km)"].push(i);
    else if(d<25)bands["Approximately 0–25 km"].push(i);
    else if(d<100)bands["Approximately 25–100 km"].push(i);
    else bands["Elsewhere in country"].push(i);
  });
  $("#cProx").innerHTML=`<div class="prox">
    <div class="head"><span>Proximity to ${esc(city)} &mdash; ${esc(label(WIN))}</span>
      <span>${items.length} incidents</span></div>
    ${Object.entries(bands).map(([k,v])=>`<div class="row ${k.startsWith("Geo")?"unres":""}"
      data-band="${esc(k)}"><span>${esc(k)}</span>
      <span class="num"><b>${v.length}</b>${v.length?` &nbsp;<span style="color:var(--muted)">${v.reduce((s,i)=>s+(i.fatalities||0),0)} killed</span>`:""}</span></div>`).join("")}
    </div>
    <p class="note">Incidents coded at country or region centroid precision are listed as
    <em>geography unresolved</em> and are never counted as near ${esc(city)}. Danger elsewhere in a
    large country is not treated as danger at this location.</p>`;
  $$("#cProx .row").forEach(el=>el.onclick=()=>{
    const list=bands[el.dataset.band];
    openPanel({trail:["World",c,el.dataset.band],
      title:`${esc(city)} &mdash; ${esc(el.dataset.band)}`,
      audit:`<b>${list.length}</b> incident(s), measured from ${esc(city)} using each incident's own
        stored coordinates. Basis: ${esc(label(WIN))}.`,
      body:list.length?list.map(incCard).join(""):`<div class="empty">None in this band.</div>`});
    $$("#pBody .inc").forEach(x=>x.onclick=()=>openIncident(
      D.incidents.find(i=>i.incident_id===x.dataset.id)));
  });
}

/* ---------- map ---------- */
function initMap(){
  if(MAP) return;
  MAP=L.map("map",{worldCopyJump:true}).setView([26,26],3);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {attribution:"&copy; OpenStreetMap, &copy; CARTO",maxZoom:18}).addTo(MAP);
  LAYER=L.layerGroup().addTo(MAP);
}
function renderMap(){
  if(!MAP) return;
  LAYER.clearLayers();
  const items=select({country:$("#m-country").value||null,category:$("#m-cat").value||null,
    win:$("#m-win").value,fatalOnly:$("#m-fatal").checked});
  let plotted=0,skipped=0;
  items.forEach(i=>{
    if(i.latitude==null||i.longitude==null||i.geo_precision===3){skipped++;return}
    plotted++;
    const f=i.fatalities||0, r=Math.min(20,5+Math.sqrt(f)*1.9);
    L.circleMarker([i.latitude,i.longitude],{radius:r,weight:1.5,color:"#7d241a",
      fillColor:f>=10?"#8d2020":f>0?"#c04f2c":"#dd8434",fillOpacity:.62})
      .bindPopup(`<h3>${esc(i.title||"")}</h3>
        <div>${esc(i.event_date)} &middot; ${esc(i.location||i.admin1||i.country)}</div>
        <div><b>${esc(D.categories[i.security_category].label)}</b>${i.security_subtype?" &middot; "+esc(i.security_subtype):""}</div>
        <div>${(i.actors||[]).map(a=>esc(a.name)).join(" vs ")||"actors not reported"}</div>
        <div>${f} reported killed</div>
        ${(i.sources||[])[0]?`<div><a href="${esc(i.sources[0].url)}" target="_blank" rel="noopener">${esc(i.sources[0].domain)}</a></div>`:""}
        <div style="margin-top:5px"><a href="#" data-pop="${esc(i.incident_id)}">Open full incident record</a></div>`)
      .addTo(LAYER);
  });
  $("#m-count").innerHTML=`${plotted} plotted`+
    (skipped?` &middot; <span style="color:var(--up)">${skipped} withheld: no exact coordinates</span>`:"");
  MAP.off("popupopen").on("popupopen",e=>{
    const a=e.popup.getElement().querySelector("[data-pop]");
    if(a) a.onclick=ev=>{ev.preventDefault();
      openIncident(D.incidents.find(i=>i.incident_id===a.dataset.pop))};
  });
}

/* ---------- boot ---------- */
function fillSelect(el,vals,all){el.innerHTML=`<option value="">${all}</option>`+
  vals.map(v=>`<option value="${esc(v.v)}">${esc(v.t)}</option>`).join("")}
function boot(data){
  D=data;
  D.incidents.forEach(i=>{const r=D.countries.find(c=>c.country===i.country);});
  renderStatus();
  const regions=[...new Set(D.incidents.map(i=>i.region).filter(Boolean))].sort();
  D.incidents.forEach(i=>{if(i.region)REGION[i.country]=i.region});
  fillSelect($("#f-region"),regions.map(r=>({v:r,t:r})),"All regions");
  const catOpts=COLS.filter(c=>D.categories[c]).map(c=>({v:c,t:D.categories[c].label}));
  fillSelect($("#f-cat"),catOpts,"All categories");
  fillSelect($("#m-cat"),catOpts,"All categories");
  fillSelect($("#m-country"),D.countries.map(c=>({v:c.country,t:c.country})),"All countries");
  fillSelect($("#f-status"),[...new Set(D.countries.map(c=>c.danger_status))].map(s=>({v:s,t:s})),"All");
  ["#q","#f-region","#f-cat","#f-trend","#f-status"].forEach(s=>{
    $(s).addEventListener("input",renderTable)});
  $$(".winsel button").forEach(b=>b.onclick=()=>{
    WIN=b.dataset.win;
    $$(".winsel button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    renderTable(); if(VIEW==="country")renderCountry();
  });
  $("#backGlobal").onclick=()=>show("global");
  ["#cCat","#cCity"].forEach(s=>$(s).addEventListener("change",renderCountry));
  ["#m-country","#m-cat","#m-win","#m-fatal"].forEach(s=>$(s).addEventListener("change",renderMap));
  renderTable();
}
(async()=>{
  if(INLINE_DATA) return boot(INLINE_DATA);
  try{ boot(await (await fetch("data.json")).json()); }
  catch(e){ document.body.innerHTML=
    `<div class="empty">Could not load <code>data.json</code>.<br>
     Run <code>python -m pipeline.run_pipeline --seed</code> first, then serve this folder.</div>`; }
})();
</script>
</body>
</html>
